services:
  - type: web
    name: a2a-invoice-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_PATH
        value: ./data/agent.db
      - key: AI_MODEL
        value: gpt-5-nano
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: A2A_BEARER_TOKEN
        sync: false
      - key: A2A_BASE_URL
        sync: false
